automation:
  - id: sync_mb_standing_lamp
    alias: Sync Master Bedroom Standing Lamp
    trigger:
      - platform: state
        entity_id:
          - switch.mb_soc
          - light.mb_soc_bulb
        to:
          - "on"
          - "off"
        id: entity_sync
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: "on"
        trigger: device
        id: device_on
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: "off"
        trigger: device
        id: device_off
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: brightness_move_up
        trigger: device
        id: brightness_up
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: brightness_move_down
        trigger: device
        id: brightness_down
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: entity_sync
              - condition: template
                value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
            sequence:
              - service: "homeassistant.turn_{{ trigger.to_state.state }}"
                target:
