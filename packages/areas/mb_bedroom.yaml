  - id: mb_standing_lamp_sync
    alias: Master Bedroom Standing Lamp Sync
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - light.mb_standing_lamp_group
          - switch.mb_soc
        to:
          - "on"
          - "off"
        id: entity_sync
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: entity_sync
              - condition: template
                value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
            sequence:
              - service: "homeassistant.turn_{{ trigger.to_state.state }}"
                target:
                  entity_id: >
                    {% set triggered = trigger.entity_id %}
                    {% set target_state = trigger.to_state.state %}
                    {% set all = ["light.mb_standing_lamp_group","switch.mb_soc"] %}
                    {{ all | reject('eq', triggered) | reject('is_state', target_state) | list }}
