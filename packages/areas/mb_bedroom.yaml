# Auto-generated by hass-data-generator
# Area: Master Bedroom (mb_)
# Do not edit manually - changes will be overwritten

group:
  mb_lights:
    name: Master Bedroom Lights
    entities:
      - light.mb_bed_n
      - light.mb_bed_s
      - light.mb_lt_ceiling_hall
      - light.mb_lt_wall
      - light.mb_lt_wardrobe

input_select:
  mb_active_scene:
    name: Master Bedroom Active Scene
    options:
      - "none"
      - scene.mb_minimal
      - scene.mb_standard
      - scene.mb_template
    initial: "none"

input_datetime:
  mb_last_presence:
    name: Master Bedroom Last Presence
    has_date: true
    has_time: true
  mb_standing_lamp_dim_start_time:
    name: mb_standing_lamp Dim Start Time
    has_date: true
    has_time: true

input_boolean:
  mb_pause_automations:
    name: Master Bedroom Pause Automations
    icon: "mdi:pause-circle"

timer:
  mb_vacancy:
    name: Master Bedroom Vacancy Timer
    duration: "00:09:00"

automation:
  - id: sync_mb_standing_lamp
    alias: Sync Master Bedroom Standing Lamp
    trigger:
      - platform: state
        entity_id:
          - switch.mb_soc
          - light.mb_soc_bulb
        to:
          - "on"
          - "off"
        id: entity_sync
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: "on"
        trigger: device
        id: device_on
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: "off"
        trigger: device
        id: device_off
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: entity_sync
              - condition: template
                value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
            sequence:
              - service: "homeassistant.turn_{{ trigger.to_state.state }}"
                target:
                  entity_id: >
                    {% set triggered = trigger.entity_id %}
                    {% set all = ["switch.mb_soc","light.mb_soc_bulb"] %}
                    {{ all | reject('eq', triggered) | list }}
          - conditions:
              - condition: trigger
                id: device_on
            sequence:
              - service: homeassistant.turn_on
                target:
                  entity_id: switch.mb_soc
          - conditions:
              - condition: trigger
                id: device_off
            sequence:
              - service: homeassistant.turn_off
                target:
                  entity_id: switch.mb_soc
  - id: dim_mb_standing_lamp
    alias: Dim Master Bedroom Standing Lamp
    mode: single
    trigger:
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: brightness_move_up
        trigger: device
        id: brightness_up
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: brightness_move_down
        trigger: device
        id: brightness_down
      - domain: mqtt
        device_id: "295eb95ac369b35c6cb4d7ad18669167"
        type: action
        subtype: brightness_stop
        trigger: device
        id: brightness_stop
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: brightness_up
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.mb_standing_lamp_dim_start
                data:
                  value: "{{ state_attr('light.mb_soc_bulb', 'brightness') | default(0) }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.mb_standing_lamp_dim_direction
                data:
                  value: up
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.mb_standing_lamp_dim_start_time
                data:
                  datetime: "{{ now().strftime(\"%Y-%m-%d %H:%M:%S\") }}"
              - service: light.turn_on
                target:
                  entity_id: light.mb_soc_bulb
                data:
                  brightness: 255
                  transition: 4
          - conditions:
              - condition: trigger
                id: brightness_down
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.mb_standing_lamp_dim_start
                data:
                  value: "{{ state_attr('light.mb_soc_bulb', 'brightness') | default(255) }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.mb_standing_lamp_dim_direction
                data:
                  value: down
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.mb_standing_lamp_dim_start_time
                data:
                  datetime: "{{ now().strftime(\"%Y-%m-%d %H:%M:%S\") }}"
              - service: light.turn_on
                target:
                  entity_id: light.mb_soc_bulb
                data:
                  brightness: 1
                  transition: 4
          - conditions:
              - condition: trigger
                id: brightness_stop
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.mb_soc_bulb
                data:
                  brightness: >
                    {% set start = states('input_number.mb_standing_lamp_dim_start') | float(128) %}
                    {% set direction = states('input_text.mb_standing_lamp_dim_direction') %}
                    {% set start_time = states('input_datetime.mb_standing_lamp_dim_start_time') %}
                    {% set elapsed = (as_timestamp(now()) - as_timestamp(start_time)) | float(0) %}
                    {% set rate = 255 / 4 %}
                    {% if direction == 'up' %}
                      {{ ((start + (elapsed * rate)) | min(255)) | int }}
                    {% elif direction == 'down' %}
                      {{ ((start - (elapsed * rate)) | max(0)) | int }}
                    {% else %}
                      {{ start | int }}
                    {% endif %}
                  transition: 0
              - service: input_text.set_value
                target:
                  entity_id: input_text.mb_standing_lamp_dim_direction
                data:
                  value: "none"

input_number:
  mb_standing_lamp_dim_start:
    name: mb_standing_lamp Dim Start Brightness
    min: 0
    max: 255
    step: 1
    mode: box

input_text:
  mb_standing_lamp_dim_direction:
    name: mb_standing_lamp Dim Direction
    initial: "none"
