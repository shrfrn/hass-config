# Auto-generated by hass-data-generator
# Area: Sharon's Studio (stdn_)
# Do not edit manually - changes will be overwritten
#
# Included in light group:
#   + switch.stdn_skt

group:
  stdn_lights:
    name: Sharon's Studio Lights
    entities:
      - light.stdn_lt_wall_e
      - light.stdn_lt_wall_n
      - light.stdn_lt_wall_w
      - light.stdn_standing_lamp
      - switch.stdn_skt

input_select:
  stdn_active_scene:
    name: Sharon's Studio Active Scene
    options:
      - "none"
      - scene.stdn_standard
      - scene.stdn_minimal
      - scene.stdn_template
    initial: "none"

input_datetime:
  stdn_last_presence:
    name: Sharon's Studio Last Presence
    has_date: true
    has_time: true

input_boolean:
  stdn_pause_automations:
    name: Sharon's Studio Pause Automations
    icon: "mdi:pause-circle"

timer:
  stdn_vacancy:
    name: Sharon's Studio Vacancy Timer
    duration: "00:09:00"

light:
  - platform: template
    lights:
      stdn_standing_lamp:
        friendly_name: Studio Standing Lamp
        value_template: "{{ is_state('light.stdn_standing_lamp_group', 'on') }}"
        turn_on:
          service: light.turn_on
          target:
            entity_id: light.stdn_standing_lamp_group
        turn_off:
          service: light.turn_off
          target:
            entity_id: light.stdn_standing_lamp_group
        level_template: "{{ state_attr('light.stdn_standing_lamp_group', 'brightness') | int }}"
        set_level:
          service: light.turn_on
          target:
            entity_id: light.stdn_standing_lamp_group
          data:
            brightness: "{{ brightness }}"
  - platform: group
    name: stdn_standing_lamp_group
    unique_id: stdn_standing_lamp_group
    entities:
      - light.stdn_standing_lamp_bulb

automation:
  - id: stdn_standing_lamp_sync
    alias: Studio Standing Lamp Sync
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - light.stdn_standing_lamp_group
          - switch.stdn_skt
        to:
          - "on"
          - "off"
        id: entity_sync
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: entity_sync
              - condition: template
                value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
            sequence:
              - service: "homeassistant.turn_{{ trigger.to_state.state }}"
                target:
                  entity_id: >
                    {% set triggered = trigger.entity_id %}
                    {% set target_state = trigger.to_state.state %}
                    {% set all = ["light.stdn_standing_lamp_group","switch.stdn_skt"] %}
                    {{ all | reject('eq', triggered) | reject('is_state', target_state) | list }}
