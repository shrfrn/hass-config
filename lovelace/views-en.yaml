                          name: Apple TV
                          tap_action:
                            action: fire-dom-event
                            browser_mod:
                              service: browser_mod.javascript
                              data:
                                code: hass.callService('input_select', 'select_option',
                                  {"option":"apple_tv","entity_id":"input_select.tv_samsung_7_series_65"});
                                  setTimeout(() => hass.callService('remote',
                                  'send_command',
                                  {"command":"KEY_EXIT","entity_id":"remote.tv_samsung_7_series_65"}),
                                  3000); hass.callService('remote',
                                  'send_command',
                                  {"command":"wakeup","entity_id":"remote.slvn"});
                                  hass.callService('remote', 'send_command',
                                  {"command":"KEY_EXIT","entity_id":"remote.tv_samsung_7_series_65"})
                    - name: Exit
