    event: sunset
    offset: 00:20:00
    id: sun_down
  - trigger: sun
    event: sunrise
    offset: -00:20:00
    id: sun_up
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - sun_down
    then:
    - action: input_boolean.turn_on
      metadata: {}
      target:
        entity_id: input_boolean.is_dark
      data: {}
    else:
    - action: input_boolean.turn_off
