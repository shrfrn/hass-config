- id: '1765636186997'
  alias: IPAS LEDs
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.is_dark
    from:
    - 'on'
    to:
    - 'off'
    id: sun_up
  - trigger: state
    entity_id:
    - input_boolean.is_dark
    from:
    - 'off'
    to:
    - 'on'
    id: sun_down
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - sun_up
    then:
    - action: switch.turn_off
      metadata: {}
      target:
        entity_id: switch.dim_wall_switch_leds
      data: {}
    else:
    - action: switch.turn_on
      metadata: {}
      target:
        entity_id: switch.dim_wall_switch_leds
      data: {}
  mode: single
